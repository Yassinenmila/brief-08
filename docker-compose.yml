services:
  app:
    build: .
    container_name: app
    depends_on:
      - db
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"

  db:
    image: mysql:8.1
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword   # root
      MYSQL_DATABASE: mon_projet_db       # DB automatique
      MYSQL_USER: user                    # utilisateur standard
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
